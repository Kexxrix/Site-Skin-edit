<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TITAN v002 영상 검토</title>
<style>body{margin:24px;background:#161b22;color:#eee;font:16px Arial,sans-serif}main{max-width:1440px;margin:auto}h1{font-size:20px}video{width:100%;height:auto;display:block;background:#000}button{font:inherit;margin:16px 16px 0 0;padding:10px 18px;cursor:pointer}output{font-variant-numeric:tabular-nums}small{display:block;margin-top:12px;color:#bac2ce}</style>
<main><h1>TITAN v002 · 06 Sportsbook / 07 Operations / 08 자동 차단</h1><video id="review" controls preload="auto" playsinline src="/TITAN-Review-v002.mp4"></video><button id="replay">처음부터 1배속 재생</button><output id="status">영상 로딩 중</output><small>전체 10.5초 · 2400×1024 · 30fps · 무음. 사용자 최종 미감 승인은 별도입니다.</small></main>
<script>const v=document.getElementById('review'),s=document.getElementById('status');window.reviewPlayback={events:[],startedAt:null,endedAt:null};const record=event=>{reviewPlayback.events.push({event,wall:performance.now(),time:v.currentTime,rate:v.playbackRate,paused:v.paused,ended:v.ended});s.value=`${v.currentTime.toFixed(3)} / ${Number.isFinite(v.duration)?v.duration.toFixed(3):'?'}초 · ${v.playbackRate}배속`;};['loadedmetadata','play','playing','pause','ratechange','timeupdate','ended','error'].forEach(e=>v.addEventListener(e,()=>{if(e==='ended')reviewPlayback.endedAt=performance.now();record(e)}));document.getElementById('replay').onclick=()=>{v.currentTime=0;v.playbackRate=1;reviewPlayback.startedAt=performance.now();reviewPlayback.endedAt=null;v.play();};</script></html>
