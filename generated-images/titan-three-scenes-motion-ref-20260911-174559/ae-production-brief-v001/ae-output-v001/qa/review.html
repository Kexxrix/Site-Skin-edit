<!doctype html><html lang="ko"><meta charset="utf-8"><title>TITAN 171프레임 재생 검수</title><style>body{margin:0;background:#17191c;color:#eee;font:16px system-ui}header{padding:18px 30px;display:flex;gap:24px;align-items:center}button{padding:12px 20px;cursor:pointer}video{width:100%;max-height:calc(100vh - 140px);display:block;background:#000}pre{margin:16px 30px;white-space:pre-wrap}</style><header><b>TITAN · 01—03</b><button id="play">처음부터 1배속 검수</button><span>2400 × 1024 · 30fps · 5.700s · 무음</span></header><video id="v" src="/review.mp4" controls playsinline preload="auto"></video><pre id="status">재생 대기</pre><script>
const v=document.querySelector('#v'),status=document.querySelector('#status');let run=null;
v.requestVideoFrameCallback(function frame(now,m){if(run)run.frames.push({wall_ms:now,media_seconds:m.mediaTime,presented:m.presentedFrames});v.requestVideoFrameCallback(frame)});
document.querySelector('#play').onclick=async()=>{v.pause();v.currentTime=0;v.playbackRate=1;run={started_at:new Date().toISOString(),start_wall:performance.now(),rate:1,frames:[],events:[]};await v.play();status.textContent='1배속 재생 중';};
for(const event of ['playing','waiting','stalled','pause','ended','ratechange'])v.addEventListener(event,async()=>{if(!run)return;run.events.push({event,wall_ms:performance.now(),media_seconds:v.currentTime,rate:v.playbackRate});if(event==='ended'){const report={...run,end_wall:performance.now(),end_seconds:v.currentTime,duration:v.duration,quality:v.getVideoPlaybackQuality()};run=null;status.textContent=JSON.stringify({ended:true,duration:report.duration,rate:report.rate,wall_seconds:(report.end_wall-report.start_wall)/1000,frameCallbacks:report.frames.length,dropped:report.quality.droppedVideoFrames},null,2);await fetch('/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});}});
</script></html>
