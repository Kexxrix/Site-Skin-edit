<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>NPB NIGHT SERIES</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./design.css">
  <link rel="stylesheet" href="./typography.css">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./login.css">
  <link rel="stylesheet" href="./subjects.css">
  <link rel="stylesheet" href="./ballparks.css">
  <link rel="stylesheet" href="./card-editions.css">
  <script src="./flag-background.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body data-team="giants">
  <template id="frame-normal-light">
    <svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
      <defs>
        <filter x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0 0 2 0 -1  0 0 2 0 -1  0 0 2 0 -1  0 0 0 1 0"/>
          <feComponentTransfer>
            <feFuncR type="table" tableValues=".20 .23 .27 .31 .35 .40 .45 .51 .59 .74 1"/>
            <feFuncG type="table" tableValues=".22 .25 .29 .33 .37 .42 .47 .53 .61 .76 1"/>
            <feFuncB type="table" tableValues=".24 .27 .31 .35 .39 .44 .49 .55 .64 .80 1"/>
          </feComponentTransfer>
        </filter>
      </defs>
    </svg>
  </template>
  <main id="world" aria-busy="true">
    <div id="backgrounds" aria-hidden="true"></div>
    <div id="stage">
      <div id="page-host"><p class="loading">読み込み中…</p></div>
      <header id="header-host"></header>
      <nav id="navigation-host" aria-label="メインメニュー"></nav>
      <div id="team-menu-host"></div>
    </div>
  </main>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="status" role="status" aria-live="polite"></div>
</body>
</html>
