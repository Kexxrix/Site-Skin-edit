<section class="scene entry-screen" aria-label="NPB NIGHT SERIES ログイン">
  <img class="entry-stadium" src="assets/login/stadium.png" alt="">
  <div class="entry-night" aria-hidden="true"></div>
  <div class="entry-flag" aria-hidden="true"><img src="assets/login/league-flag.png" alt=""></div>
  <div class="entry-shade" aria-hidden="true"></div>
  <div class="entry-panel">
    <div class="entry-glass" aria-hidden="true"></div>
    <img class="entry-frame" src="assets/login/frame.png" alt="">
    <div class="entry-edge" aria-hidden="true"><span></span></div>
    <h1 class="entry-brand"><img src="assets/login/brand.png" alt="NPB NIGHT SERIES"></h1>
    <p class="entry-welcome">Welcome to NPB NIGHT SERIES</p>
    <div class="entry-divider" aria-hidden="true"></div>
    <form class="entry-form" autocomplete="off">
      <label class="entry-field"><input type="text" aria-label="ユーザーID" placeholder="ユーザーID" autocomplete="off" spellcheck="false" required></label>
      <label class="entry-field"><input type="password" aria-label="パスワード" placeholder="パスワード" autocomplete="off" required></label>
      <button class="entry-submit" type="submit">ログイン</button>
    </form>
    <div class="entry-emblems" aria-hidden="true">
      <img src="assets/login/baseball.png" alt=""><img src="assets/login/diamond.png" alt="">
    </div>
    <i class="entry-corner top left" aria-hidden="true"></i>
    <i class="entry-corner top right" aria-hidden="true"></i>
    <i class="entry-corner bottom left" aria-hidden="true"></i>
    <i class="entry-corner bottom right" aria-hidden="true"></i>
    <p class="entry-credit">Powered by HADES.</p>
  </div>
</section>
